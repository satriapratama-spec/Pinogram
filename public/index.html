<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Login - Pinogram</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-center items-center">

    <!-- PAGE 1: INPUT TOKEN BOT -->
    <div id="page-token" class="w-full max-w-md p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl mx-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-sky-400">📌 Pinogram</h1>
            <p class="text-xs text-slate-400 mt-1">Masukkan Token Bot untuk Melanjutkan</p>
        </div>
        <div class="space-y-4">
            <div>
                <input type="text" id="token-input" placeholder="Masukkan Token Bot..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 font-mono">
            </div>
            <button onclick="submitToken()" class="w-full bg-sky-600 hover:bg-sky-500 py-3 rounded-xl font-semibold transition text-sm">Berikutnya</button>
            <p id="token-error" class="text-red-400 text-xs text-center hidden">Token salah atau gagal mengirim OTP!</p>
        </div>
    </div>

    <!-- PAGE 2: INPUT OTP + INFO TOKEN -->
    <div id="page-otp" class="hidden w-full max-w-md p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl mx-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-sky-400">🔑 Verifikasi OTP</h1>
            <p class="text-xs text-slate-400 mt-1">Kode telah dikirim ke Grup Telegram</p>
        </div>
        
        <!-- Info Token Tersamar ala Telegram -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 mb-4 flex items-center justify-between">
            <div>
                <div class="text-[10px] text-slate-500 uppercase font-semibold">Token Bot Terhubung</div>
                <div id="masked-token" class="text-xs font-mono text-sky-400 mt-0.5">xxxxxxxx</div>
            </div>
            <button onclick="backToToken()" class="text-xs text-slate-400 hover:text-white underline">Ubah</button>
        </div>

        <div class="space-y-4">
            <div>
                <input type="text" id="otp-input" placeholder="Masukkan 4 Digit OTP" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center tracking-widest text-lg font-mono focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="verifyOtp()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-semibold transition text-sm">Masuk</button>
            <p id="otp-error" class="text-red-400 text-xs text-center hidden">Kode OTP salah!</p>
            <button onclick="resendOtp()" class="w-full text-center text-xs text-slate-500 hover:underline mt-2">Kirim Ulang OTP ke Grup</button>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="app-page" class="hidden w-full h-screen flex flex-col md:flex-row bg-slate-900 overflow-hidden">
        <div class="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col bg-slate-950 h-1/3 md:h-full">
            <div class="p-3 border-b border-slate-800 font-bold text-lg text-sky-400 flex items-center justify-between">
                <span>📌 Pinogram</span>
                <button onclick="logout()" class="text-xs text-red-400 hover:underline">Keluar</button>
            </div>
            <div id="chat-list" class="overflow-y-auto flex-1 divide-y divide-slate-900"></div>
        </div>

        <div class="w-full md:w-2/3 flex flex-col bg-slate-900 h-2/3 md:h-full">
            <div id="chat-header" class="p-3 border-b border-slate-800 font-semibold text-sm bg-slate-950 text-slate-300">Pilih chat di samping</div>
            <div id="message-container" class="flex-1 p-3 overflow-y-auto space-y-3 flex flex-col">
                <div class="text-center text-slate-500 my-auto text-sm">Belum ada chat dipilih</div>
            </div>
            <div id="input-area" class="p-3 border-t border-slate-800 bg-slate-950 hidden flex gap-2">
                <input type="text" id="message-input" placeholder="Ketik pesan..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
                <button onclick="sendMessage()" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded-lg font-medium text-sm transition">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = null;
        let activeToken = '';

        if(localStorage.getItem('pinogram_auth') === 'true') {
            showApp();
        }

        async function submitToken() {
            const token = document.getElementById('token-input').value.trim();
            const errEl = document.getElementById('token-error');
            errEl.classList.add('hidden');
            
            if(!token) {
                errEl.innerText = "Token tidak boleh kosong!";
                errEl.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/request-login-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token})
                });
                const data = await res.json();
                
                if(res.ok && data.status === 'success') {
                    activeToken = token;
                    // Format masked token ala Telegram (misal: 8177708...xxxx)
                    const masked = token.length > 10 ? token.substring(0, 8) + '...' + token.slice(-4) : token;
                    document.getElementById('masked-token').innerText = masked;
                    
                    // Pindah ke Page 2
                    document.getElementById('page-token').classList.add('hidden');
                    document.getElementById('page-otp').classList.remove('hidden');
                } else {
                    errEl.innerText = data.message || "Token salah!";
                    errEl.classList.remove('hidden');
                }
            } catch(e) { 
                errEl.innerText = "Gagal terhubung ke server!";
                errEl.classList.remove('hidden'); 
            }
        }

        async function verifyOtp() {
            const otp = document.getElementById('otp-input').value.trim();
            const errEl = document.getElementById('otp-error');
            errEl.classList.add('hidden');

            try {
                const res = await fetch('/api/verify-login-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({otp})
                });
                if(res.ok) {
                    localStorage.setItem('pinogram_auth', 'true');
                    showApp();
                } else {
                    errEl.classList.remove('hidden');
                }
            } catch(e) { 
                errEl.classList.remove('hidden'); 
            }
        }

        async function resendOtp() {
            try {
                const res = await fetch('/api/resend-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: activeToken})
                });
                const data = await res.json();
                alert(data.message || "OTP dikirim ulang ke grup!");
            } catch(e) { alert("Gagal mengirim ulang OTP"); }
        }

        function backToToken() {
            document.getElementById('page-otp').classList.add('hidden');
            document.getElementById('page-token').classList.remove('hidden');
            document.getElementById('otp-input').value = '';
        }

        function logout() {
            localStorage.removeItem('pinogram_auth');
            location.reload();
        }

        function showApp() {
            document.getElementById('page-token').classList.add('hidden');
            document.getElementById('page-otp').classList.add('hidden');
            document.getElementById('app-page').classList.remove('hidden');
            loadChats();
        }

        async function loadChats() {
            try {
                const res = await fetch('/api/chats');
                const chats = await res.json();
                const listEl = document.getElementById('chat-list');
                listEl.innerHTML = '';
                
                if (chats.length === 0) {
                    listEl.innerHTML = `<div class="p-4 text-xs text-slate-500 text-center">Menunggu pesan OTP masuk dari grup target...</div>`;
                    return;
                }

                chats.forEach(chat => {
                    listEl.innerHTML += `
                        <div onclick="selectChat('${chat.chat_id}', '${chat.name}')" class="p-3 hover:bg-slate-900 cursor-pointer transition border-l-4 border-transparent hover:border-sky-500">
                            <div class="font-semibold text-sm truncate">${chat.name}</div>
                            <div class="text-[10px] text-slate-500">ID: ${chat.chat_id}</div>
                        </div>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function selectChat(chatId, name) {
            currentChatId = chatId;
            document.getElementById('chat-header').innerText = `Target: ${name}`;
            document.getElementById('input-area').classList.remove('hidden');
            loadMessages();
        }

        async function loadMessages() {
            if (!currentChatId) return;
            try {
                const res = await fetch(`/api/messages/${currentChatId}`);
                const msgs = await res.json();
                const container = document.getElementById('message-container');
                container.innerHTML = '';

                msgs.forEach(m => {
                    const isOut = m.direction === 'out';
                    const otpBadge = m.is_otp ? `<span class="bg-amber-500 text-black text-[9px] font-bold px-1.5 py-0.5 rounded ml-1">🔑 OTP</span>` : '';
                    
                    container.innerHTML += `
                        <div class="flex flex-col ${isOut ? 'items-end' : 'items-start'}">
                            <div class="max-w-[85%] rounded-xl px-3 py-2 text-sm ${isOut ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-200'} shadow">
                                <div class="text-[9px] text-slate-300 font-semibold mb-0.5 flex items-center justify-between">
                                    <span>${m.sender}</span> ${otpBadge}
                                </div>
                                <div class="font-mono text-base tracking-wide break-all">${m.text}</div>
                                <div class="text-[8px] text-right text-slate-400 mt-0.5">${m.time}</div>
                            </div>
                        </div>
                    `;
                });
                container.scrollTop = container.scrollHeight;
            } catch (err) { console.error(err); }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            await fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: currentChatId, text})
            });

            input.value = '';
            loadMessages();
        }

        setInterval(() => {
            if(localStorage.getItem('pinogram_auth') === 'true') {
                loadChats();
                if(currentChatId) loadMessages();
            }
        }, 3000);
    </script>
</body>
</html>
