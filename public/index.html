<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinogram - OTP Dashboard & Telegram Web</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex overflow-hidden">

    <!-- Sidebar Chat List -->
    <div class="w-1/3 border-r border-slate-800 flex flex-col bg-slate-950">
        <div class="p-4 border-b border-slate-800 font-bold text-xl text-sky-400 flex items-center justify-between">
            <span>📌 Pinogram</span>
            <span class="text-xs bg-sky-950 text-sky-300 px-2 py-1 rounded border border-sky-800">OTP Active</span>
        </div>
        <div id="chat-list" class="overflow-y-auto flex-1 divide-y divide-slate-900">
            <!-- List chat dimuat via JS -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="w-2/3 flex flex-col bg-slate-900">
        <div id="chat-header" class="p-4 border-b border-slate-800 font-semibold bg-slate-950">
            Pilih chat di sebelah kiri
        </div>
        <div id="message-container" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
            <div class="text-center text-slate-500 my-auto">Belum ada chat yang dipilih</div>
        </div>
        <div id="input-area" class="p-4 border-t border-slate-800 bg-slate-950 hidden flex gap-2">
            <input type="text" id="message-input" placeholder="Ketik pesan atau balasan..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-sky-500">
            <button onclick="sendMessage()" class="bg-sky-600 hover:bg-sky-500 px-5 py-2 rounded-lg font-medium transition">Kirim</button>
        </div>
    </div>

    <script>
        let currentChatId = null;

        async function loadChats() {
            try {
                const res = await fetch('/api/chats');
                const chats = await res.json();
                const listEl = document.getElementById('chat-list');
                listEl.innerHTML = '';
                
                if (chats.length === 0) {
                    listEl.innerHTML = `<div class="p-4 text-xs text-slate-500 text-center">Belum ada aktivitas pesan masuk</div>`;
                    return;
                }

                chats.forEach(chat => {
                    listEl.innerHTML += `
                        <div onclick="selectChat('${chat.chat_id}', '${chat.name}')" class="p-4 hover:bg-slate-900 cursor-pointer transition border-l-4 border-transparent hover:border-sky-500">
                            <div class="font-semibold text-sm">${chat.name}</div>
                            <div class="text-[11px] text-slate-500">ID: ${chat.chat_id}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Gagal memuat chat:", err);
            }
        }

        async function selectChat(chatId, name) {
            currentChatId = chatId;
            document.getElementById('chat-header').innerText = `Target: ${name} (${chatId})`;
            document.getElementById('input-area').classList.remove('hidden');
            loadMessages();
        }

        async function loadMessages() {
            if (!currentChatId) return;
            try {
                const res = await fetch(`/api/messages/${currentChatId}`);
                const msgs = await res.json();
                const container = document.getElementById('message-container');
                container.innerHTML = '';

                msgs.forEach(m => {
                    const isOut = m.direction === 'out';
                    const otpBadge = m.is_otp ? `<span class="bg-amber-500 text-black text-[10px] font-bold px-1.5 py-0.5 rounded ml-2">🔑 OTP DETECTED</span>` : '';
                    
                    container.innerHTML += `
                        <div class="flex flex-col ${isOut ? 'items-end' : 'items-start'}">
                            <div class="max-w-md rounded-2xl px-4 py-2 text-sm ${isOut ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-200'} shadow">
                                <div class="text-[10px] text-slate-300 font-semibold mb-1 flex items-center justify-between">
                                    <span>${m.sender}</span>
                                    ${otpBadge}
                                </div>
                                <div class="font-mono text-base tracking-wide">${m.text}</div>
                                <div class="text-[9px] text-right text-slate-400 mt-1">${m.time}</div>
                            </div>
                        </div>
                    `;
                });
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error("Gagal memuat pesan:", err);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            await fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: currentChatId, text })
            });

            input.value = '';
            loadMessages();
        }

        setInterval(() => {
            loadChats();
            if (currentChatId) loadMessages();
        }, 3000);

        loadChats();
    </script>
</body>
</html>
